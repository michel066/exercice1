<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="espacecode.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- formulaire -->
    <div class="contentformulaire">
      <div class="longtrait"></div>
      <div class="espace">
        <div class="logo"><i class="fa-regular fa-address-book"></i></div>
        <p class="titre">Monespace</p>
      </div>
      <h2 class="texte">Bon retour.</h2>
      <h6 class="connecter">
        connecter-vous pour accéder à votre espace <br />
        personnel.
      </h6>
      <form action="">
        <div class="email">
          <label class="adresmail" for="">ADRESSE EMAIL</label>
          <input class="mailtexte" type="text" placeholder="vous@exemple.fr" />
        </div>

        <div class="email mdp">
          <label class="adresmail" for="">MOT DE PASSE</label>
          <input class="mailtexte" type="text" placeholder="**********" />
          <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <div class="remember-me">
          <input class="vrai" type="checkbox" id="remember" name="remember" />
          <label class="souvien" for="remember">Se souvenir de moi</label>
        </div>
        <div class="seconnecter">
          <a href="" style="text-decoration: none;">
            <button class="se">Se connecter </button>
          </a>
        </div>
        <div class="divsection">
          <div class="selectionn"></div>
          <div>ou</div>
          <div class="selectionn"></div>
        </div>
        <div class="Btn1">
          <a href="">
            <button class="secondary">
              <i
                class="fa-brands fa-google fa-beat"
                style="color: rgb(207, 77, 43)"
              ></i>
              Continuer avec google
            </button>
          </a>
        </div>
        <p class="zzz">
          Pas encore de compte ? <a href="#" class="compte"> créer un compte</a>
        </p>
      </form>
    </div>
  </body>
</html>
